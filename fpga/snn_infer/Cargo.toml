[package]
name        = "snn_infer"
version     = "0.1.0"
edition     = "2021"
description = "SNN + RF fault inference engine untuk Kria KV260 (tanpa PYNQ)"

[[bin]]
name = "snn_infer"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft    = "6"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
