[package]
name = "teensy-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
teensy4-bsp = { version = "0.4", features = ["rt"] }
teensy4-panic = "0.2"
cortex-m = "0.7"
ads1x1x = "0.2"
embedded-hal = "0.2.7"
nb = "0.1.3"
shared-bus = "0.3.1"
usb-device = "0.2.9"
usbd-serial = "0.1.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

