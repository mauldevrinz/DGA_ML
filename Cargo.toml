[package]
name = "dga-enose"
version = "1.0.0"
edition = "2021"
authors = ["Akhmad Maulvin Nazir Zakaria"]
description = "DGA Electronic Nose - Transformer Oil Fault Diagnosis System"

[dependencies]
# GUI
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_plot = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", features = ["png", "jpeg"] }
rfd = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Machine Learning
linfa = "0.7"
linfa-svm = "0.7"
linfa-trees = "0.7"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-stats = "0.5"
ndarray-rand = "0.14"
smartcore = "0.3"

# Serial Communication
serialport = "4"

# CSV
csv = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bincode = "1"
rand = "0.8"
statrs = "0.17"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
